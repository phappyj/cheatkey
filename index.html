<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>직장인 치트키 | 오늘의 원픽 최저가 · AI 치트키</title>
<meta name="description" content="직접 3종을 비교해 고른 오늘의 원픽 최저가와 야근을 줄여주는 AI 치트키를 한 페이지에. 스크롤 없이 1탭으로 쿠팡 최저가 확인.">
<meta name="theme-color" content="#F8F9FA">
<meta property="og:type" content="website">
<meta property="og:title" content="⚡ 직장인 치트키 — 오늘의 원픽 최저가">
<meta property="og:description" content="3종 비교로 고른 오늘의 원픽 + 바로 쓰는 AI 치트키. 1탭으로 쿠팡 최저가 확인.">
<meta property="og:url" content="https://phappyj.github.io/cheatkey/">
<meta property="og:image" content="https://phappyj.github.io/cheatkey/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="직장인 치트키 — 오늘의 원픽 최저가와 AI 꿀팁">
<meta property="og:site_name" content="직장인 치트키">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://phappyj.github.io/cheatkey/og.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23FFFFFF'/><text x='50' y='73' font-size='58' text-anchor='middle'>⚡</text></svg>">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --bg:#F8F9FA;
    --card:#FFFFFF;
    --line:#EAECEF;
    --line-2:#F1F2F4;
    --ink:#111827;
    --ink-2:#6B7280;
    --ink-3:#9CA3AF;
    --navy:#0F172A;
    --navy-2:#1E293B;
    --mint:#0E9F6E;
    --mint-soft:#ECFDF5;
    --mint-line:#BBF0DD;
    --coral:#F04438;
    --coral-soft:#FEF1EF;
    --amber:#B45309;
    --radius:18px;
    --max:480px;
    --shadow:0 1px 2px rgba(17,24,39,.04), 0 10px 28px -20px rgba(17,24,39,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  html{background:var(--bg);scroll-behavior:smooth}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",Roboto,sans-serif;
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    letter-spacing:-0.012em;
    min-height:100dvh;
    word-break:keep-all;
  }
  .num,.price,.tnum{font-variant-numeric:tabular-nums}
  .shell{max-width:var(--max);margin:0 auto;padding:0 18px 104px}

  /* ───────────── nav ───────────── */
  .nav{
    position:sticky;top:0;z-index:30;
    background:rgba(248,249,250,.86);
    -webkit-backdrop-filter:saturate(160%) blur(14px);
    backdrop-filter:saturate(160%) blur(14px);
    border-bottom:1px solid rgba(17,24,39,.06);
  }
  .nav-in{
    max-width:var(--max);margin:0 auto;
    display:flex;align-items:center;gap:10px;
    padding:calc(9px + env(safe-area-inset-top)) 18px 9px 18px;
  }
  .brand{
    display:inline-flex;align-items:center;gap:6px;
    font-size:13.5px;font-weight:800;letter-spacing:-0.02em;color:var(--ink);
    text-decoration:none;white-space:nowrap;flex:0 0 auto;
  }
  .brand .bolt{font-size:13px;line-height:1;color:var(--ink)}
  .chips{display:flex;gap:6px;margin-left:auto;min-width:0}
  .chip{
    display:inline-flex;align-items:center;
    font-size:11.5px;font-weight:700;letter-spacing:-0.01em;
    color:var(--ink-2);background:#fff;
    border:1px solid var(--line);border-radius:999px;
    padding:5px 10px;text-decoration:none;white-space:nowrap;
    transition:color .15s ease, border-color .15s ease, background .15s ease;
  }
  .chip:active{background:#F3F4F6}
  .chip.hero-chip{color:var(--navy);border-color:#DDE0E5;font-weight:800}

  /* ───────────── hero ───────────── */
  .hero{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:22px;
    box-shadow:0 1px 2px rgba(17,24,39,.04), 0 18px 40px -30px rgba(17,24,39,.28);
    padding:13px 13px 14px;
    margin-top:12px;
  }
  .hero-eyebrow{
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    padding:0 2px 10px;
  }
  .badge-best{
    display:inline-flex;align-items:center;gap:5px;
    font-size:10.5px;font-weight:800;letter-spacing:-0.01em;
    color:#fff;background:var(--navy);
    border-radius:7px;padding:4px 8px;
  }
  .badge-best .spark{color:#6EE7B7;font-size:9px}
  .badge-quiet{
    display:inline-flex;align-items:center;gap:4px;
    font-size:10.5px;font-weight:700;color:var(--mint);
    background:var(--mint-soft);border:1px solid var(--mint-line);
    border-radius:7px;padding:3px 7px;
  }
  .hero-media{
    background:#F4F5F7;
    border:1px solid var(--line-2);
    border-radius:16px;
    height:212px;
    display:grid;place-items:center;
    overflow:hidden;
    padding:10px;
  }
  .hero-media img{
    width:100%;height:100%;object-fit:contain;display:block;
    mix-blend-mode:multiply;
  }
  .hero-title{
    font-size:15.5px;line-height:1.42;font-weight:700;
    margin:12px 3px 8px;letter-spacing:-0.025em;
    color:var(--ink);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .hero-price{
    display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;
    padding:0 3px;margin-bottom:7px;
  }
  .hero-price .now{
    font-size:29px;font-weight:800;letter-spacing:-0.045em;line-height:1;
    color:var(--ink);
  }
  .hero-price .now small{font-size:16px;font-weight:700;margin-left:1px;letter-spacing:-0.02em}
  .hero-price .was{
    font-size:12.5px;font-weight:600;color:var(--ink-3);
    text-decoration:line-through;text-decoration-thickness:1px;
  }
  .hero-price .off{
    font-size:11px;font-weight:800;letter-spacing:-0.01em;
    color:#fff;background:var(--coral);
    padding:3px 6px;border-radius:6px;
    align-self:center;
  }
  .hero-meta{
    display:flex;align-items:flex-start;gap:5px;
    margin:0 3px 12px;font-size:11.5px;line-height:1.5;
    color:var(--ink-2);font-weight:500;
  }
  .hero-meta svg{flex:0 0 12px;width:12px;height:12px;margin-top:2px;color:var(--mint)}
  .cta{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;min-height:57px;padding:14px 16px;
    background:var(--navy);color:#fff;
    font-size:16px;font-weight:800;letter-spacing:-0.025em;
    border-radius:15px;text-decoration:none;
    box-shadow:0 10px 22px -14px rgba(15,23,42,.75);
    transition:transform .12s ease, background .15s ease;
  }
  .cta:active{transform:scale(.986);background:#0B1220}
  .cta svg{width:17px;height:17px;flex:0 0 auto;color:#6EE7B7}
  .hero-foot{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    margin:9px 3px 0;font-size:10.5px;color:var(--ink-3);font-weight:500;
  }

  /* ───────────── section ───────────── */
  section{margin-top:36px;scroll-margin-top:64px}
  .sec-head{
    display:flex;align-items:baseline;gap:8px;margin-bottom:13px;padding:0 1px;
  }
  .sec-head .kicker{
    font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--ink-3);
    text-transform:uppercase;flex:0 0 auto;
  }
  .sec-head h2{
    font-size:17.5px;font-weight:800;letter-spacing:-0.035em;margin:0;color:var(--ink);
  }
  .sec-head .count{
    margin-left:auto;font-size:11.5px;color:var(--ink-3);font-weight:600;white-space:nowrap;
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }

  /* ───────────── 3종 비교 ───────────── */
  .report{padding:15px 14px 13px}
  .report .r-lead{
    margin:7px 2px 13px;
    font-size:12.5px;line-height:1.6;color:var(--ink-2);font-weight:500;
  }
  .report .r-lead b{color:var(--ink);font-weight:700}

  .cmp-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px}
  table.cmp{
    width:100%;border-collapse:separate;border-spacing:0;
    table-layout:fixed;font-size:10.8px;line-height:1.45;
  }
  table.cmp th,table.cmp td{
    padding:8px 6px;text-align:center;vertical-align:middle;
    border-bottom:1px solid var(--line-2);
    word-break:keep-all;overflow-wrap:break-word;
  }
  table.cmp thead th{
    border-bottom:1px solid var(--line);
    padding:10px 5px 9px;
    background:#FCFCFD;
    vertical-align:top;
  }
  table.cmp thead th:first-child{background:transparent}
  table.cmp thead th.best{
    background:var(--mint-soft);
    border-top:2px solid var(--mint);
    border-radius:0;
  }
  table.cmp tbody tr:last-child td{border-bottom:0}
  table.cmp thead th:first-child{width:50px;padding:0}
  table.cmp td.k{
    width:50px;text-align:left;font-size:10px;font-weight:700;color:var(--ink-3);
    letter-spacing:-0.01em;padding:8px 4px 8px 2px;line-height:1.35;
  }
  table.cmp tbody td.best{background:#F7FEFB}
  table.cmp .pick{
    display:inline-block;font-size:8.5px;font-weight:800;letter-spacing:.04em;
    color:#fff;background:var(--mint);border-radius:4px;
    padding:2px 5px;margin-bottom:5px;
  }
  table.cmp .pname{
    display:block;font-size:11px;font-weight:800;color:var(--ink);
    letter-spacing:-0.02em;line-height:1.3;margin-bottom:5px;
  }
  table.cmp .pname.mute{font-weight:700;color:#4B5563}
  table.cmp .pprice{
    display:block;font-size:12px;font-weight:800;color:var(--navy);
    letter-spacing:-0.03em;
  }
  table.cmp .pprice.hot{color:var(--mint)}
  table.cmp .pnote{
    display:block;font-size:9px;font-weight:600;color:var(--ink-3);margin-top:2px;
  }
  table.cmp td.v{color:#374151;font-weight:600;font-size:10.8px}
  table.cmp td.v b{color:var(--ink);font-weight:800}
  table.cmp td.cons{color:#9A3412;font-weight:600;background:#FFFBF7}
  table.cmp tbody td.cons.best{background:#FFFDF9}
  .cmp-legend{
    display:flex;align-items:flex-start;gap:5px;
    margin:10px 2px 0;font-size:10px;line-height:1.5;color:var(--ink-3);font-weight:500;
  }
  .cmp-legend svg{flex:0 0 11px;width:11px;height:11px;margin-top:2px;color:var(--mint)}
  .verdict{
    margin-top:12px;padding:12px 13px;border-radius:13px;
    background:#F7F8FA;border:1px solid var(--line);
    font-size:12px;line-height:1.6;color:#4B5563;font-weight:500;
  }
  .verdict .vk{
    display:block;font-size:10px;font-weight:800;letter-spacing:.1em;
    color:var(--mint);margin-bottom:4px;text-transform:uppercase;
  }
  .verdict b{color:var(--ink);font-weight:700}

  /* ───────────── 핫딜 리스트 ───────────── */
  .deal{
    display:flex;gap:13px;align-items:center;
    padding:13px;text-decoration:none;color:inherit;
  }
  .deal + .deal{margin-top:10px}
  .deal .thumb{
    flex:0 0 74px;height:74px;border-radius:12px;overflow:hidden;
    background:#F4F5F7;border:1px solid var(--line-2);
    display:grid;place-items:center;padding:5px;
  }
  .deal .thumb img{width:100%;height:100%;object-fit:contain;display:block;mix-blend-mode:multiply}
  .deal .info{min-width:0;flex:1}
  .deal .seller{
    font-size:9.5px;font-weight:800;letter-spacing:.06em;color:var(--mint);
    margin-bottom:3px;
  }
  .deal .name{
    font-size:13px;font-weight:700;line-height:1.4;color:var(--ink);
    margin:0 0 5px;letter-spacing:-0.02em;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .price{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
  .price .now{font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-0.03em}
  .price .was{font-size:11px;color:var(--ink-3);text-decoration:line-through}
  .price .off{font-size:11px;font-weight:800;color:var(--coral)}
  .deal .note{font-size:11px;color:var(--ink-2);margin-top:4px;line-height:1.45}

  /* 빈 상태 */
  .soon{text-align:center;padding:26px 20px;border-style:dashed}
  .soon .clock{
    display:inline-flex;align-items:center;gap:6px;
    font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--ink-3);
    background:#F7F8FA;border:1px solid var(--line);
    border-radius:999px;padding:4px 10px;margin-bottom:11px;
  }
  .soon .clock .dot{width:5px;height:5px;border-radius:50%;background:var(--mint);animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .soon strong{display:block;font-size:14.5px;font-weight:800;margin-bottom:5px;color:var(--ink)}
  .soon span.s{font-size:12px;color:var(--ink-2);line-height:1.6}

  /* ───────────── AI 치트키 ───────────── */
  .tip{padding:16px 15px 15px}
  .tip + .tip{margin-top:12px}
  .tip .tag{
    display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.05em;
    color:var(--mint);background:var(--mint-soft);border:1px solid var(--mint-line);
    border-radius:999px;padding:3px 9px;margin-bottom:10px;
  }
  .tip h3{
    font-size:18.5px;line-height:1.35;font-weight:800;margin:0 0 6px;
    letter-spacing:-0.04em;color:var(--ink);
  }
  .tip h3 .accent{color:var(--mint)}
  .tip p.sub{margin:0 0 13px;color:var(--ink-2);font-size:12.5px;font-weight:500;line-height:1.55}
  .steps{list-style:none;margin:0 0 13px;padding:0;display:grid;gap:6px}
  .steps li{
    display:flex;align-items:flex-start;gap:9px;
    background:#FAFBFC;border:1px solid var(--line-2);
    border-radius:11px;padding:9px 11px;
  }
  .steps .num{
    flex:0 0 20px;height:20px;border-radius:6px;
    background:#EEF0F3;color:var(--navy);
    font-weight:800;font-size:11px;
    display:grid;place-items:center;margin-top:1px;
  }
  .steps .body{min-width:0}
  .steps .k{display:block;font-size:9.5px;font-weight:800;color:var(--mint);letter-spacing:.04em;margin-bottom:2px}
  .steps .v{font-size:12.8px;font-weight:600;color:#374151;line-height:1.45}

  .promptbox{
    position:relative;
    background:#F7F8FA;border:1px solid var(--line);
    border-radius:12px;padding:11px 12px;margin-bottom:11px;
    font-size:11.5px;line-height:1.62;color:#4B5563;
    max-height:104px;overflow:hidden;
    -webkit-mask-image:linear-gradient(180deg,#000 62%,rgba(0,0,0,.15));
    mask-image:linear-gradient(180deg,#000 62%,rgba(0,0,0,.15));
    white-space:pre-wrap;word-break:break-word;
  }
  .promptbox .plabel{
    display:block;font-size:9px;font-weight:800;letter-spacing:.1em;
    color:var(--ink-3);margin-bottom:5px;text-transform:uppercase;
  }
  .btn-row{display:flex;gap:7px;flex-wrap:wrap}
  .btn{
    appearance:none;border:1px solid var(--line);
    background:#fff;color:var(--ink);
    font:inherit;font-size:12.5px;font-weight:700;letter-spacing:-0.01em;
    padding:10px 14px;border-radius:11px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;text-decoration:none;
    transition:transform .12s ease, background .15s ease;
  }
  .btn:active{transform:scale(.975)}
  .btn svg{width:13px;height:13px;flex:0 0 auto}
  .btn.primary{background:var(--navy);border-color:var(--navy);color:#fff;flex:1 1 auto;justify-content:center}
  .btn.primary svg{color:#6EE7B7}
  .btn.ghost{color:var(--ink-2);font-weight:700}
  .btn.ghost svg{color:var(--ink-3)}

  /* ───────────── 팔로우 ───────────── */
  .follow{display:grid;gap:8px}
  .follow a{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:13px 15px;border-radius:14px;text-decoration:none;color:var(--ink);
    background:var(--card);border:1px solid var(--line);
    box-shadow:0 1px 2px rgba(17,24,39,.03);
    transition:border-color .15s ease;
  }
  .follow a:active{border-color:#D8DBE0}
  .follow .lbl{display:flex;flex-direction:column;gap:1px;min-width:0}
  .follow .lbl b{font-size:13px;font-weight:700;letter-spacing:-0.02em}
  .follow .lbl small{font-size:11px;color:var(--ink-2);font-weight:500}
  .follow .arrow{color:var(--ink-3);font-weight:700;font-size:13px}

  /* ───────────── footer ───────────── */
  footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--line)}
  .disclosure{
    font-size:10.5px;line-height:1.75;color:var(--ink-2);font-weight:500;
    background:#F3F4F6;border-radius:12px;padding:12px 14px;margin:0;
  }
  .colophon{
    display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
    margin-top:14px;font-size:10.5px;color:var(--ink-3);font-weight:500;
  }

  /* ───────────── sticky ───────────── */
  .sticky{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    padding:9px 14px calc(9px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.9);
    -webkit-backdrop-filter:saturate(180%) blur(16px);
    backdrop-filter:saturate(180%) blur(16px);
    border-top:1px solid var(--line);
    box-shadow:0 -10px 28px -22px rgba(17,24,39,.5);
    transform:translateY(130%);transition:transform .24s cubic-bezier(.22,.61,.36,1);
  }
  .sticky.on{transform:translateY(0)}
  .sticky .in{max-width:var(--max);margin:0 auto;display:flex;align-items:center;gap:10px}
  .sticky .pr{min-width:0;flex:1}
  .sticky .pr b{
    display:block;font-size:16px;font-weight:800;letter-spacing:-0.035em;
    line-height:1.2;color:var(--ink);
  }
  .sticky .pr small{
    display:block;font-size:10px;color:var(--ink-3);font-weight:500;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px;
  }
  .sticky a.go{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;
    background:var(--navy);color:#fff;
    font-size:13px;font-weight:800;letter-spacing:-0.02em;text-decoration:none;
    padding:12px 15px;border-radius:12px;
    box-shadow:0 8px 18px -12px rgba(15,23,42,.9);
  }
  .sticky a.go svg{width:14px;height:14px;color:#6EE7B7}

  /* ───────────── toast ───────────── */
  .toast{
    position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));
    transform:translate(-50%,14px);
    background:var(--navy);color:#fff;
    font-size:12.5px;font-weight:700;letter-spacing:-0.01em;
    padding:10px 17px;border-radius:999px;
    opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;
    z-index:60;box-shadow:0 14px 30px -12px rgba(15,23,42,.7);
    white-space:nowrap;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}

  @media (max-width:359px){
    .hero-media{height:186px}
    .hero-title{font-size:14.5px}
    .hero-price .now{font-size:26px}
  }
  @media (min-width:431px){
    .hero-media{height:250px}
    .hero-title{font-size:16.5px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    html{scroll-behavior:auto}
  }
</style>
</head>
<body>

<div class="nav">

    var count = document.getElementById("deals-count");
    host.innerHTML = "";

    if (!list || !list.length) {
      count.textContent = "";
      var soon = document.createElement("div");
      soon.className = "card soon";
      soon.innerHTML =
        '<span class="clock"><span class="dot"></span>NEXT UPDATE</span>' +
        "<strong>다음 검증 핫딜을 준비 중입니다</strong>" +
        '<span class="s">직접 비교해 고른 IT·가전·생활템만 올립니다.<br>가격이 바뀌면 바로 내립니다.</span>';
      host.appendChild(soon);
      return;
    }

    count.textContent = list.length + "개";

    list.forEach(function (d, idx) {
      var a = document.createElement("a");
      a.className = "card deal";
      a.href = d.link || "#";
      a.target = "_blank";
      a.rel = "noopener sponsored";

      var priceBits = "";
      if (d.price != null && d.price !== "") {
        priceBits += '<span class="now">' + formatWon(d.price) + "</span>";
      }
      if (d.wasPrice != null && d.wasPrice !== "") {
        priceBits += '<span class="was">' + formatWon(d.wasPrice) + "</span>";
      }
      if (d.discount != null && d.discount !== "") {
        priceBits += '<span class="off">' + esc(d.discount) + "</span>";
      }

      a.innerHTML =
        '<span class="thumb">' + (d.image ? '<img src="' + esc(d.image) + '" alt="" loading="' + (idx === 0 ? "eager" : "lazy") + '">' : TAG_ICON) + "</span>" +
        '<span class="info">' +
          '<span class="seller">' + esc(d.seller || "쿠팡 파트너스") + "</span>" +
          '<span class="name">' + esc(d.title) + "</span>" +
          (priceBits ? '<span class="price">' + priceBits + "</span>" : "") +
          (d.note ? '<span class="note">' + esc(d.note) + "</span>" : "") +
        "</span>";

      host.appendChild(a);
    });
  }

  /* ── 04 AI 치트키 ── */
  function renderTips(list) {
    var host = document.getElementById("tips");
    var count = document.getElementById("tips-count");
    host.innerHTML = "";
    if (!list || !list.length) { count.textContent = ""; return; }
    count.textContent = list.length + "개";

    list.forEach(function (t) {
      var el = document.createElement("article");
      el.className = "card tip";

      var steps = (t.steps || []).map(function (s, i) {
        return '<li><span class="num">' + (i + 1) + '</span>' +
               '<span class="body"><span class="k">' + esc(s.k) + '</span>' +
               '<span class="v">' + esc(s.v) + '</span></span></li>';
      }).join("");

      var promptBox = "";
      var buttons = "";
      if (t.prompt) {
        promptBox = '<div class="promptbox"><span class="plabel">Prompt</span>' + esc(t.prompt) + '</div>';
        buttons += '<button class="btn primary" type="button" data-copy="' + esc(t.prompt) + '">' +
                   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>' +
                   '복사하기</button>';
        buttons += '<a class="btn ghost" href="https://chatgpt.com/" target="_blank" rel="noopener">ChatGPT 열기 ↗</a>';
      }
      if (t.link) {
        buttons += '<a class="btn ghost" href="' + esc(t.link) + '" target="_blank" rel="noopener">' +
                   esc(t.linkLabel || "원문 보기") + ' ↗</a>';
      }

      el.innerHTML =
        (t.tag ? '<span class="tag">' + esc(t.tag) + (t.no ? " · " + esc(t.no) : "") + '</span>' : "") +
        "<h3>" + (t.title || "") + "</h3>" +
        (t.sub ? '<p class="sub">' + esc(t.sub) + "</p>" : "") +
        (steps ? '<ul class="steps">' + steps + "</ul>" : "") +
        promptBox +
        (t.note ? '<p class="sub" style="margin:-2px 0 12px">' + esc(t.note) + "</p>" : "") +
        (buttons ? '<div class="btn-row">' + buttons + "</div>" : "");

      host.appendChild(el);
    });
  }

  /* ── 스티키 ── */
  var sticky = document.getElementById("sticky");
  var stickyOn = false;
  function renderSticky(d) {
    if (!d) return;
    document.getElementById("sticky-price").textContent = formatWon(d.price) || "최저가";
    document.getElementById("sticky-name").textContent = d.shortTitle || d.title || "";
    document.getElementById("sticky-go").href = d.link || "#";
  }
  var heroIO = null;
  function observeHero() {
    if (!heroCta || !("IntersectionObserver" in window)) return;
    if (heroIO) heroIO.disconnect();
    var io = heroIO = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        var shouldShow = !e.isIntersecting && e.boundingClientRect.top < 0;
        if (shouldShow !== stickyOn) {
          stickyOn = shouldShow;
          sticky.classList.toggle("on", shouldShow);
          sticky.setAttribute("aria-hidden", shouldShow ? "false" : "true");
        }
      });
    }, { threshold: 0 });
    io.observe(heroCta);
  }

  function render(data) {
    var deals = data.deals || [];
    renderHero(deals, data);
    renderReport(deals);
    renderDeals(deals);
    renderTips(data.tips || []);
    if (data.updated) {
      var lab = timeLabel(data.updated);
      if (lab) document.getElementById("updated").textContent = "업데이트 " + lab;
    }
  }

  document.addEventListener("click", function (e) {
    var btn = e.target.closest ? e.target.closest("[data-copy]") : null;
    if (!btn) return;
    e.preventDefault();
    copyText(btn.getAttribute("data-copy"), "프롬프트 복사 완료");
  });

  document.getElementById("year").textContent = new Date().getFullYear();

  render(FALLBACK);

  fetch("deals.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(render)
    .catch(function () { /* 폴백 유지 */ });
})();
</script>
</body>
</html>
