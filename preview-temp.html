<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>preview harness (temporary)</title>
<style>
  body{margin:0;padding:14px;background:#E9ECEF;font:12px/1.4 -apple-system,system-ui,sans-serif;display:flex;gap:20px;align-items:flex-start}
  figure{margin:0}
  figcaption{font-weight:700;margin-bottom:6px;color:#334155}
  iframe{display:block;border:1px solid #CBD5E1;background:#fff}
</style>
</head>
<body>
  <figure>
    <figcaption>Mobile 390 × 900</figcaption>
    <iframe id="m" src="/cheatkey/" width="390" height="900" title="mobile preview"></iframe>
  </figure>
  <figure>
    <figcaption>Desktop 1280 × 900</figcaption>
    <iframe id="d" src="/cheatkey/" width="1280" height="900" title="desktop preview"></iframe>
  </figure>
<script>
  function jump(fr) {
    try {
      var doc = fr.contentDocument, w = fr.contentWindow;
      var t = doc.getElementById("deals-section");
      if (!t) return;
      w.scrollTo(0, t.getBoundingClientRect().top + w.scrollY - 8);
    } catch (e) {}
  }
  ["m", "d"].forEach(function (id) {
    var fr = document.getElementById(id);
    fr.addEventListener("load", function () { setTimeout(function () { jump(fr); }, 600); });
  });
</script>
</body>
</html>
